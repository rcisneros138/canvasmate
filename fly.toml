# Fly.io app config.
#
# First-time setup:
#   1. `flyctl launch --no-deploy` (or `flyctl apps create canvasmate` then accept this file)
#   2. `fly volumes create canvasmate_data --region <your-region> --size 1`
#   3. `fly secrets set RESEND_API_KEY=... MAIL_FROM=... TURNSTILE_SECRET=... TURNSTILE_SITE_KEY=... APP_URL=https://your-domain.org`
#   4. `fly deploy`
#
# To attach a custom domain after deploy:
#   `fly certs add canvasmate.org`
#   then follow the displayed DNS records (A/AAAA + ACME challenge).
#
# Update `app` below to the name `flyctl launch` assigns (or your preferred app name).

app = "canvasmate"
primary_region = "iad"

[build]
  # Uses the existing repo-root Dockerfile (multi-stage Node 22 + better-sqlite3).
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Fly sits behind their global edge; req.ip must follow X-Forwarded-For.
  TRUST_PROXY = "true"
  # Override APP_URL once you've attached the production domain:
  #   `fly secrets set APP_URL=https://canvasmate.org`

[[mounts]]
  source = "canvasmate_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
